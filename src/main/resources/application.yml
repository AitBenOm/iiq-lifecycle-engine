spring:
  application:
    name: iiq-lifecycle-engine

  datasource:
    url: jdbc:postgresql://localhost:5433/iiq_lifecycle
    username: omar
    password: secret
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8888

logging:
  level:
    org.hibernate.SQL: debug
